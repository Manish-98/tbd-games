name: Bug Report
description: Report a reproducible problem
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
  - type: input
    id: os
    attributes:
      label: Operating System
  - type: input
    id: game
    attributes:
      label: Game / Feature
  - type: input
    id: version
    attributes:
      label: Version / Commit
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots, recordings, console errors, or other useful information.
