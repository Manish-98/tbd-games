name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Publish or remove preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add ../pages-deploy origin/gh-pages
          else
            mkdir ../pages-deploy
            cd ../pages-deploy
            git init
            git checkout --orphan gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          PREVIEW_DIR="../pages-deploy/pr-preview/pr-${PR_NUMBER}"

          if [ "${ACTION}" = "closed" ]; then
            rm -rf "${PREVIEW_DIR}"
          else
            rm -rf "${PREVIEW_DIR}"
            mkdir -p "${PREVIEW_DIR}"
            rsync -a --exclude ".git/" --exclude "pr-preview/" "${GITHUB_WORKSPACE}/" "${PREVIEW_DIR}/"
            touch "${PREVIEW_DIR}/.nojekyll"
          fi

          cd ../pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "Preview state is already up to date."
          else
            if [ "${ACTION}" = "closed" ]; then
              git commit -m "deploy: remove PR preview #${PR_NUMBER}"
            else
              git commit -m "deploy: update PR preview #${PR_NUMBER}"
            fi

            git push origin HEAD:gh-pages
          fi

      - name: Update PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          PREVIEW_URL: https://manish-98.github.io/tbd-games/pr-preview/pr-${{ github.event.pull_request.number }}/
          MARKER: "<!-- pr-preview -->"
        run: |
          set -euo pipefail

          pr_body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"

          if printf '%s' "${pr_body}" | grep -qF "${MARKER}"; then
            base_body="$(printf '%s' "${pr_body}" | sed "/${MARKER}/,$d")"
          else
            base_body="${pr_body}"
          fi

          if [ -n "${base_body}" ]; then
            base_body="${base_body}

          "
          fi

          if [ "${ACTION}" = "closed" ]; then
            preview_section="${MARKER}
          ## Preview

          Preview deployment removed because this PR is closed."
          else
            preview_section="${MARKER}
          ## Preview

          [Open the latest preview deployment ↗](${PREVIEW_URL})

          Preview updates automatically when new commits are pushed to this PR."
          fi

          updated_body="${base_body}${preview_section}"

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f body="${updated_body}"
